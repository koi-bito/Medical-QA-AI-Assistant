version: "3.8"

services:
  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Leave DATABASE_URL blank to use SQLite for local testing
      # Or set to your PostgreSQL URL for a full prod-like test
      DATABASE_URL: "sqlite:///./medical_qa.db"
      SECRET_KEY: ${SECRET_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
      USE_GROQ: "true"
      LIGHTWEIGHT_MODE: "true"
      FRONTEND_URL: "http://localhost:3000"
